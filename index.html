<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Attack</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="base.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1 id="title">Click Attack</h1>
    <h2>Welcome to Click Attack!</h2>
    <div>
      <label for="playerName">Player name:</label>
      <input type="text" id="playerName">

      <label for="attackValue">Attack Value:</label>
      <input id="attackValue" type="number" min="1" max="10" value="1">
    </div>

    <p id="message" class="feedback">
      Enter your name and choose an attack value.
    </p>
    <p>Score: <span id="score">0</span></p>
    <p>Number of attacks: <span id="attackCount">0</span></p>

    <button id="attackButton">Attack</button>
    <button id="resetButton">Reset</button>

    <section class="card">
        <h2>Attack History</h2>
        <ul id="history"></ul>
    </section>

</body>
</html>
